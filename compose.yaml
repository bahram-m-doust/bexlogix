name: bexlogix

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bexlogix-app:local
    container_name: bexlogix-app
    environment:
      BEXLOGIX_DATABASE_URL: sqlite:////app/runtime/bexlogix.db
      OSRM_BASE_URL: http://osrm:5000
      VROOM_BASE_URL: http://vroom:3000
      MAP_TILE_SERVICE_BASE: http://tiles:8080
      MAP_TILE_URL_TEMPLATE: http://127.0.0.1:8080/data/tehran_raster/{z}/{x}/{y}.png
      OFFLINE_OSRM_GRAPH_PATH: /app/offline/osrm/data/tehran-latest.osrm
      OFFLINE_TILES_MB_TILES_GLOB: /app/offline/tiles/data/*.mbtiles
    volumes:
      - bexlogix-runtime:/app/runtime
      - ./offline:/app/offline:ro
    # Share the tile service network namespace so 127.0.0.1:8080 resolves
    # consistently both in the app container and in the host browser.
    network_mode: "service:tiles"
    depends_on:
      osrm:
        condition: service_started
      vroom:
        condition: service_started
      tiles:
        condition: service_started
    restart: unless-stopped

  osrm:
    image: ${OSRM_DOCKER_IMAGE:-osrm/osrm-backend:latest}
    container_name: bexlogix-osrm
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "1000"
      - --max-trip-size
      - "1000"
      - /data/tehran-latest.osrm
    volumes:
      - ./offline/osrm/data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "osrm-routed", "--help"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  vroom:
    image: ${VROOM_DOCKER_IMAGE:-ghcr.io/vroom-project/vroom-docker:v1.15.0-rc.1}
    container_name: bexlogix-vroom
    environment:
      VROOM_ROUTER: osrm
    volumes:
      # The upstream entrypoint writes /conf/access.log at startup.
      - ./infra/offline/vroom-conf:/conf
    depends_on:
      osrm:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:3000/health' >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  tiles:
    image: ${TILE_DOCKER_IMAGE:-maptiler/tileserver-gl:latest}
    container_name: bexlogix-tiles
    command: ["--config", "/config/config.json"]
    volumes:
      - ./offline/tiles/data:/data:ro
      - ./infra/offline/tileserver:/config:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/styles.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  bexlogix-runtime:
